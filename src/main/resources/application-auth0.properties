# Auth0 Configuration Profile
# Use with: spring.profiles.active=auth0

# Auth0 Management API Configuration
# These values should be provided via environment variables in production
auth0.domain=${AUTH0_DOMAIN:your-tenant.auth0.com}
auth0.clientId=${AUTH0_CLIENT_ID:your-client-id}
auth0.clientSecret=${AUTH0_CLIENT_SECRET:your-client-secret}
auth0.audience=${AUTH0_AUDIENCE:https://your-tenant.auth0.com/api/v2/}

# Pagination Configuration
auth0.pageSize=${AUTH0_PAGE_SIZE:100}

# HTTP Client Configuration
http.client.connectTimeout=30000
http.client.readTimeout=30000
http.client.writeTimeout=30000

# Logging Configuration
logging.level.com.java_template.application.processor.Auth0Fetch=DEBUG
logging.level.com.java_template.application.processor.MergeUsers=DEBUG

