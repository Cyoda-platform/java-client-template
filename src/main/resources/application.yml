logging:
  level:
    root: INFO

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    context-path: /api

spring:
  config:
    import: optional:file:.env[.properties]
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Maximum file size for uploads (default: 1MB)
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:100MB}
      # Maximum request size for multipart/form-data (default: 10MB)
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:100MB}
      # Whether to resolve multipart requests lazily
      resolve-lazily: false

springdoc:
  swagger-ui:
    use-root-path: true
    try-it-out-enabled: true
    csrf:
      enabled: false

# CORS Configuration
# Environment-specific settings for Cross-Origin Resource Sharing
# Override via environment variables for different environments (dev/staging/prod)
app:
  cors:
    # Comma-separated list of allowed origins (no wildcards when credentials enabled)
    # Dev: http://localhost:3000,http://localhost:5173
    # Prod: https://app.yourdomain.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    # Allowed HTTP methods
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
    # Allowed request headers
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With,Cache-Control}
    # Headers exposed to the client (empty by default for security)
    exposed-headers: ${CORS_EXPOSED_HEADERS:}
    # Allow credentials (cookies, auth headers) - false is more secure
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    # Preflight cache duration in seconds (3600 = 1 hour)
    max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}
    # URL pattern to apply CORS to
    path-pattern: ${CORS_PATH_PATTERN:/**}

cyoda:
  api:
    url: https://${CYODA_HOST:localhost:8443}/api